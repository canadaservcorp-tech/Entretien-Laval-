[build]
  publish = "."

# Long cache for images and icons (file names change when images change)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# www -> apex (Netlify's primary-domain setting already does this; kept explicit)
[[redirects]]
  from = "https://www.entretienlaval.ca/*"
  to = "https://entretienlaval.ca/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site generator source is not part of the public site
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# Merchant Center feeds: public for Google, but not shown in search results
[[headers]]
  for = "/merchant-feed-*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Robots-Tag = "noindex"
